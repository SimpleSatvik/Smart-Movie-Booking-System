<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#334155" />
    </marker>
  </defs>
  <text x="600" y="45" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="22" font-family="sans-serif">UML State Machine Diagram</text>
<text x="600" y="70" text-anchor="middle" fill="#64748b" font-size="13" font-family="sans-serif">Lifecycle States of a ShowSeat Record (Concurrency &amp; Resale Management)</text>
<circle cx="80" cy="270" r="13" fill="#0f172a"/>
<g>
<rect x="195" y="240" width="150" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/>
<text x="270" y="266" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="14" font-family="sans-serif">AVAILABLE</text>
<text x="270" y="284" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">Open for selection</text>
</g>
<g>
<rect x="525" y="240" width="170" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/>
<text x="610" y="266" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="14" font-family="sans-serif">LOCKED</text>
<text x="610" y="284" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">10-minute hold window</text>
</g>
<g>
<rect x="885" y="240" width="150" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/>
<text x="960" y="266" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="14" font-family="sans-serif">BOOKED</text>
<text x="960" y="284" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">Ticket confirmed</text>
</g>
<g>
<rect x="875" y="440" width="170" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/>
<text x="960" y="466" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="14" font-family="sans-serif">RESALE_ACTIVE</text>
<text x="960" y="484" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">Listed on marketplace</text>
</g>
<circle cx="960" cy="120" r="15" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="960" cy="120" r="9" fill="#0f172a"/>
<line x1="93" y1="270" x2="195" y2="270" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="144" y="262" text-anchor="middle" fill="#334155" font-size="11" font-weight="600" font-family="sans-serif">Show created</text>
<line x1="345" y1="258" x2="525" y2="258" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="435" y="252" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="600" font-family="sans-serif">Select Seat (Row Lock)</text>
<path d="M 580 240 C 580 160, 310 160, 310 240" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
<text x="445" y="150" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="600" font-family="sans-serif">[Timeout: now &gt; locked_until] or User cancels</text>
<line x1="695" y1="270" x2="885" y2="270" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="790" y="262" text-anchor="middle" fill="#166534" font-size="11" font-weight="600" font-family="sans-serif">Payment Success</text>
<line x1="960" y1="240" x2="960" y2="140" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="968" y="195" text-anchor="start" fill="#475569" font-size="11" font-weight="600" font-family="sans-serif">Show ends / Ticket used</text>
<line x1="930" y1="300" x2="930" y2="440" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="920" y="375" text-anchor="end" fill="#1e3a8a" font-size="11" font-weight="600" font-family="sans-serif">Owner lists for resale</text>
<line x1="990" y1="440" x2="990" y2="300" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1000" y="375" text-anchor="start" fill="#166534" font-size="11" font-weight="600" font-family="sans-serif">New buyer purchases (Transfer)</text>
<path d="M 1045 470 C 1130 470, 1130 270, 1035 270" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
<text x="1135" y="375" text-anchor="middle" fill="#475569" font-size="10.5" font-family="sans-serif">Seller cancels listing</text>
</svg>